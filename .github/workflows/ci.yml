name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # The doctor and the guide on this OS, against fixtures (exit 3 = gaps found, which is expected here).
      - run: node dist/cli.js fixtures/laravel-next-monorepo --no-color
      - shell: bash
        run: node dist/cli.js doctor fixtures/laravel-next-monorepo --no-color || test $? -eq 3
      - run: node dist/cli.js setup fixtures/laravel-sqlite --dry-run --no-color
  app:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - run: npm ci && node node_modules/electron/install.js && npm run build
        working-directory: app
