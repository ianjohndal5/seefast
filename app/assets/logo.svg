<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SeeFast's character (idle): an armored sphere robot with one camera eye. Source of the app and tray icons. --><style>
.module{fill:#3a4157;stroke:#1c1a2b;stroke-width:2.2}
.glow{fill:#3cd2ff}
.shade{fill:#c4cbdb}
.shell{fill:#eef1f7}
.seam{fill:none;stroke:#1c1a2b;stroke-width:1.3;stroke-linecap:round;opacity:.42}
.gleam{fill:none;stroke:#fff;stroke-width:2.8;stroke-linecap:round}
.rivet{fill:#8e97ad}
.vent{fill:#2b3042;stroke:#1c1a2b;stroke-width:1.6}
.outline{fill:none;stroke:#1c1a2b;stroke-width:3}
.housing{fill:#2b3042;stroke:#1c1a2b;stroke-width:2.6}
.notch{fill:#4a526b}
.lights{fill:none;stroke:#3cd2ff;stroke-width:2.2;stroke-dasharray:5.1 2.06}
.glass{fill:#0f1220}
.halo{fill:#3cd2ff;opacity:.25}
.iris{fill:#1677f0}
.core{fill:#effcff}
.glint{fill:#fff}
.glint.small{opacity:.8}
.sheen{fill:none;stroke:#fff;stroke-width:1.4;stroke-linecap:round;opacity:.3}
.lid{fill:#2b3042}
.lid-edge{fill:none;stroke:#3cd2ff;stroke-width:1.8;stroke-linecap:round}
.lid-happy,.lid-worried{display:none}
.pupils{transform:translate(0px,0px)}
</style>
